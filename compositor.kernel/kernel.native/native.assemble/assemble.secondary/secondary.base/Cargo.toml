[package]
name = "compositor_kernel_native_assemble_secondary_base"
version = "0.0.1"
edition = "2024"

# Multi-GPU secondary-device assembly: open every OTHER KMS card after the primary
# boots and light its monitors locally. Additive (no-op on a single-card system).
[dependencies]
compositor_developer_debug_instance_record.workspace = true
compositor_developer_environment_config_base.workspace = true
compositor_orchestration_core_state_base.workspace = true
compositor_kernel_native_context_render_base.workspace = true
compositor_kernel_native_context_display_reconcile.workspace = true
compositor_kernel_native_wire_frame_base.workspace = true
compositor_kernel_udev_enumerate_scan_base.workspace = true
compositor_kernel_drm_device_capability_base.workspace = true
compositor_kernel_drm_device_open_base.workspace = true
compositor_kernel_drm_gbm_device_base.workspace = true
compositor_kernel_drm_gbm_alloc_base.workspace = true
compositor_kernel_drm_connector_scan_base.workspace = true
compositor_kernel_seat_interface_open_base.workspace = true
compositor_kernel_gles_multigpu_factory_base.workspace = true
compositor_kernel_scanout_surface_output_base.workspace = true
smithay.workspace = true

[lib]
path = "lib.rs"
