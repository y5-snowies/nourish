[package]
name = "compositor_kernel_vulkan_command_record_base"
version = "0.0.1"
edition = "2024"

[dependencies]
compositor_model_debug_instance_record.workspace = true
bitflags.workspace = true
smithay.workspace = true
ash.workspace = true
thiserror.workspace = true

# Compositor dependencies (CI ensures availability in workspace)
compositor_kernel_vulkan_device_factory_base.workspace = true
compositor_kernel_vulkan_pipeline_composite_base.workspace = true

[package.metadata.lint]
allow = ["size"]
reason = "One composition recording: the damaged and full-redraw variants differ only in the target acquire and the attachment load-op, so they share the barrier + pass choreography rather than duplicating it across two crates."

[lib]
path = "lib.rs"
