[package]
name = "compositor_orchestration_seat_pointer_publish"
version = "0.0.1"
edition = "2024"

# Empty, like its siblings: the writers are input paths in the orchestration
# layer and the reader is the Vulkan renderer, so this must sit below both.
[dependencies]

[package.metadata.lint]
allow = ["size"]
reason = "A published slot plus the layout of the block it fills. The bulk is why each value is where it is — a lane meaning that lives away from the lane is how a shader and an engine come to disagree about what they are exchanging."

[lib]
path = "lib.rs"
