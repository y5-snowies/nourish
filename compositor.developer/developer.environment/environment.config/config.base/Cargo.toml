[package]
name = "compositor_developer_environment_config_base"
version = "0.0.1"
edition = "2024"

# This crate is deliberately at the very bottom of the dependency graph: it has
# NO dependency on the logging crate (compositor_developer_debug_instance_record),
# so the logging system itself can depend on it for `log_level`. Keep deps to
# serde only.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The `mode` token type used in `gpu_router` entries. config.mode is serde+bitflags
# only (no logging dep), so config.base can sit on it and stay below the logging crate.
compositor_developer_environment_config_mode = { workspace = true }

[lib]
path = "lib.rs"
