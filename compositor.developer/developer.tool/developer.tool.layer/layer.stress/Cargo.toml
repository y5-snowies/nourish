# Standalone Wayland layer-shell stress-test harness (controller + subject).
# Sibling of ../../developer.tool.window/window.stress, for wlr-layer-shell instead of xdg.
# Deliberately OUTSIDE the repo's link.all.sh cross-workspace graph: its own [workspace], its
# own Cargo.lock, crates.io deps only, plain-stderr diagnostics.
[package]
name = "y5-layer-stress"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Own workspace root so cargo does not walk up into the compositor workspaces.
[workspace]

[lib]
name = "layer_stress"
path = "src/lib.rs"

[[bin]]
name = "layer-stress-controller"
path = "src/bin/controller.rs"

[[bin]]
name = "layer-stress-subject"
path = "src/bin/subject.rs"

[dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# staging  -> wp_fractional_scale_v1, wp_viewporter
# unstable -> xdg popups reused for layer-surface popups
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# zwlr_layer_shell_v1 / zwlr_layer_surface_v1 (re-exported by sctk::shell::wlr_layer)
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.13"
