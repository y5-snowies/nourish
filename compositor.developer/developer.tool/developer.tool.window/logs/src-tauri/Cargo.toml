[package]
name = "compositor-developer-tool"
version = "0.1.0"
edition = "2021"
description = "y5 developer log viewer (Tauri + React)"

# Standalone: this is its own workspace root so it never joins a compositor workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-prost-build = "0.14"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = "0.1"

[profile.dev]
incremental = true

# Release profile. Declared per-component because Cargo only honours `[profile.*]` at the
# workspace root it is invoked from, and `prepare.sh` builds each component by cd-ing into
# its own root — so nothing is inherited from the compositor's profile in
# `compositor.kernel/kernel.loader/Cargo.toml`. Without this block a shipped binary gets
# cargo's defaults: no LTO, 16 codegen units, unstripped.
#
# THIN rather than fat, unlike the other components: this is the largest dependency graph
# in the bundle after the compositor, its fat-LTO link is serial and multi-minute, and the
# multiarch pipeline pays that cost once per (distro × arch) leg — 13 times. Thin LTO plus
# `strip` recovers most of the size for a fraction of the link, and a log viewer is not on
# any hot path where the difference in codegen would be noticed.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
