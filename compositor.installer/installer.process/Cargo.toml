# Standalone installer workspace. NOT part of the main compositor link.json /
# link.all.sh loop — these crates are built and shipped on their own (like
# pollkit-agent and mx-gesture-daemon). They follow the same chain-prefix naming
# convention but are wired by plain path deps here.
[workspace]
resolver = "2"
members = [
    "process.*/*/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
compositor_installer_process_packages_enumerate_base = { path = "process.packages/packages.enumerate/enumerate.base" }
compositor_installer_process_config_parse_base = { path = "process.config/config.parse/parse.base" }
compositor_installer_process_layout_compute_base = { path = "process.layout/layout.compute/compute.base" }

# Release profile. Declared per-component because Cargo only honours `[profile.*]` at the
# workspace root it is invoked from, and `prepare.sh` builds each component by cd-ing into
# its own root — so nothing is inherited from the compositor's profile in
# `compositor.kernel/kernel.loader/Cargo.toml`. Without this block a shipped binary gets
# cargo's defaults: no LTO, 16 codegen units, unstripped.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release-fast]
# What every local build and `environment/check.sh` use: release optimizations
# without LTO. Declared in EVERY workspace root because cargo only honours
# `[profile.*]` at the root it is invoked from — defined in one root only,
# `--profile release-fast` simply fails from all the others.
# Comments sit INSIDE the table: `workspace.link.js` inserts its generated block
# immediately before the first `[header]` after [workspace.dependencies], so a
# comment block above this one would be orphaned above the generated links.
# `inherits = "release"` refers to cargo's built-in release profile — no local
# `[profile.release]` is needed here.
inherits = "release"
lto = false
codegen-units = 16
