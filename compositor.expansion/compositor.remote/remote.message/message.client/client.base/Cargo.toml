[package]
name = "compositor_remote_message_client_base"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bitflags = { workspace = true }
smithay = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
compositor_remote_message_macro_base = { workspace = true }
tonic-prost = { workspace = true }
[build-dependencies]
tonic-prost-build = { workspace = true }


[package.metadata.lint]
allow = ["size"]
reason = "The `define!` invocation: one block declaring every gRPC service, its methods and their request/response types. It is a table, and its length is the number of RPCs the compositor exposes. Splitting it would mean two macro invocations building two master enums, which is exactly the thing the single invocation exists to prevent."

[lib]
path = "lib.rs"
