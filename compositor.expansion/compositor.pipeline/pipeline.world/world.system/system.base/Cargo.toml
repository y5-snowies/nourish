[package]
name = "compositor_pipeline_world_system_base"
version = "0.0.1"
edition = "2024"

[dependencies]
compositor_kernel_vulkan_memory_external_base = { workspace = true }
compositor_pipeline_build_place_base = { workspace = true }
compositor_support_system_storage_slot_base = { workspace = true }
compositor_pipeline_build_pipeline_base = { workspace = true }
compositor_pipeline_abi_worldset_base = { workspace = true }
compositor_support_system_trait_system_base = { workspace = true }
compositor_support_system_storage_token_base = { workspace = true }
compositor_support_system_buffer_token_base = { workspace = true }
compositor_support_system_world_frame_base = { workspace = true }
compositor_orchestration_seat_pointer_publish = { workspace = true }
compositor_pipeline_abi_clock_base = { workspace = true }

[package.metadata.lint]
allow = ["size"]
reason = "The per-world slot, its tokens and the system that maintains it are one unit: `y5_storage!` makes the write token crate-private on purpose, so splitting the state from its only writer would force that token public and lose the guarantee that nothing else can mutate a world's pipeline tables. The bulk is the rationale for the liveness rule, which is the part that is not derivable from the code."

[lib]
path = "lib.rs"
