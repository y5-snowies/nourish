[package]
name = "compositor_pipeline_abi_clock_base"
version = "0.0.1"
edition = "2024"

# Empty, and now for a better reason than the one it used to have.
#
# It lived in `kernel.graphic/graphic.bridge` and was kept dependency-free so
# that it would sit BELOW every producer and consumer — the two `t` producers,
# the timestamp publisher and the worker — and so be reachable from all of them
# without any of them declaring a dependency on the pipeline. That is the
# crate-level form of parking state in a global: the location was chosen by who
# needed to reach it, not by who owns it.
#
# It is dependency-free here because a time origin genuinely depends on nothing,
# and it lives here because the shader ABI owns it.
[dependencies]

[lib]
path = "lib.rs"
