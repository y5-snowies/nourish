[package.metadata.lint]
allow = ["size"]
reason = "Mostly an asset table: one line per shipped bundle file, plus the path normalisation that lets bundles share sources across folders. Splitting the data from the four accessors that read it would put the two halves in different crates for no reader's benefit."

