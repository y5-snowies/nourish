[package]
name = "compositor_pipeline_build_seam_base"
version = "0.0.1"
edition = "2024"

[dependencies]
compositor_pipeline_abi_seam_base = { workspace = true }
compositor_pipeline_world_system_base = { workspace = true }
compositor_pipeline_abi_worldset_base = { workspace = true }
compositor_pipeline_build_pipeline_base = { workspace = true }
compositor_pipeline_bundle_manifest_base = { workspace = true }
compositor_pipeline_host_hit_base = { workspace = true }
compositor_pipeline_host_map_base = { workspace = true }
compositor_orchestration_draw_dispatch_frame = { workspace = true }
compositor_pipeline_abi_push_base = { workspace = true }
compositor_pipeline_abi_clock_base = { workspace = true }
smithay = { workspace = true }

[package.metadata.lint]
allow = ["size"]
reason = "The seam builder and the pointer warp that answers against the same pipeline. They are one unit: `multipass_pass` pushes each pass from the live param array and `warp_point` must resolve the warp from that same array, so splitting them puts the picture and the cursor correction in different crates with nothing holding them to the same values."

[lib]
path = "lib.rs"
