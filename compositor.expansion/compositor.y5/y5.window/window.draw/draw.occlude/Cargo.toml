[package]
name = "compositor_y5_window_draw_occlude"
version = "0.0.1"
edition = "2024"


[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bitflags = { workspace = true }
smithay = { workspace = true }

[package.metadata.lint]
allow = ["size"]
reason = "Three near-identical booleans about one window, whose whole difficulty is which consumer reads which — frame callbacks, fractional scale, xdg suspended. The length is the note saying so; without it the next consumer picks whichever name reads best and is wrong in a way nothing catches."

[lib]
path = "lib.rs"
