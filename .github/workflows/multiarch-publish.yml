name: Multiarch Publish

# Build the FULL end-user install bundle natively on EACH target distro × CPU arch, then publish
# them so a user on that distro/arch can download and install exactly like the Fedora one-liner.
#
# This is the multiarch peer of docs.yml (the Fedora "main CD"): each combo runs the SAME
# compositor.installer/prepare.sh that docs.yml uses — building every shipped component
# (compositor, devtool window, polkit agent, MX gesture daemon, xwayland-satellite, settings
# tool, interactive installer) inside that distro's own image (environment.container/
# distributions/<distro>/Containerfile, MODE=bundle). Each bundle already contains its own
# install.sh + y5-install, so it IS the per-distro installer.
#
# WHY per-distro: the binaries are dynamically linked to that distro's glibc / mesa / Vulkan /
# ffmpeg / webkit. A Fedora bundle won't reliably run on Debian; each distro gets its own bundle.
# WHY native arm: aarch64 legs run on `ubuntu-24.04-arm` (free on public repos) — no QEMU.
#
# TRIGGERS (candidate ONLY — the RC branch; never fires on upstream-integration/PRs):
#   - push to `candidate`      -> build all combos, (re)publish the rolling `bundles-rolling`
#                                 prerelease with a package-<distro>-<arch>.tar.gz per combo.
#   - workflow_dispatch        -> same, for a manual re-run.
#
# STAGING NOTE: this publishes to GitHub Releases only — it does NOT touch the Pages
# /release/latest/fedora44 site docs.yml owns. Once this channel is verified, the plan is to
# fold it into the main CD (Pages /release/latest/<distro>/) and retire the Fedora-only path.
#
# COST: heavy (all components, per distro, incl. a Tauri build). fail-fast:false so a distro
# missing a dep surfaces itself instead of cancelling the rest. On a public repo the runners
# are free; the budget is wall-clock. Prune the matrix if you don't need every distro.

on:
  push:
    branches: [candidate]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Stage the heavy build dirs on the runner's big /mnt disk, not the ~14 GB root fs. The
  # per-distro cargo target cache (the bulk of the build) and the source clone both live here.
  Y5_DIST_CACHE: /mnt/y5/cache
  Y5_DIST_SRC: /mnt/y5/src

jobs:
  # Compute the rc version ONCE (committed VERSION + rc-tag history; ci/scripts/version-rc.sh)
  # and hand it to every build so the number baked into each distro's binary matches — exactly
  # how release-rc.yml stamps its rc bundle.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: compute
        run: |
          v="$(ci/scripts/version-rc.sh)"
          echo ">> multiarch build version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.distro }} · ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # One entry per (distro, arch). distro = a subdir under
        # environment.container/distributions/ with a bundle-capable Containerfile; runner =
        # ubuntu-24.04 (x86_64) or ubuntu-24.04-arm (aarch64, native — no QEMU). Base images are
        # pinned in each Containerfile. Arch is x86_64-only: the official archlinux image has no
        # arm64 build.
        #
        # NO ubuntu-24.04 / debian-12 — they ship libinput 1.25.0 / 1.22.x, and the compositor
        # needs >= 1.26 for the tablet-pad dial symbols (smithay enables the `input` crate's
        # `libinput_1_26`). `y5_compositor` does not LINK on either. See the matching comment
        # in docs.yml for what it would take to put them back. Keep this list in step with
        # docs.yml's `bundles` matrix and with bootstrap.sh's KNOWN.
        include:
          - { distro: fedora-43,    arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: fedora-43,    arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: fedora-44,    arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: fedora-44,    arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: debian-13,    arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: debian-13,    arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: ubuntu-26.04, arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: ubuntu-26.04, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: arch,         arch: x86_64,  runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
        # A normal (non-worktree) checkout so distributions/prepare_source can `git clone .` it.

      # Podman + an OCI runtime that can actually start a container. Runner images from
      # 2026-07-26 pair Podman 5.8.4 with Ubuntu's crun 1.14.1, which rejects the OCI spec
      # version podman 5 emits ("unknown version specified") and kills the FIRST `RUN` of
      # every Containerfile. runc ships with the runner's Docker install and handles it, so
      # pin it when present — see the fuller note on the same step in docs.yml.
      - name: Ensure podman + a working OCI runtime
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          if command -v runc >/dev/null; then
            mkdir -p ~/.config/containers
            printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
            echo ">> pinned podman to runc (crun on this image may be too old for podman 5)"
          else
            echo ">> runc not found — leaving podman on its default runtime"
          fi
          podman info --format '>> podman {{.Version.Version}} / runtime {{.Host.OCIRuntime.Name}}' || true

      - name: Reclaim disk + swap headroom + stage heavy build dirs on /mnt
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet \
                      /usr/local/.ghcup /opt/ghc || true
          sudo mkdir -p /mnt/y5
          sudo chown -R "$(id -u):$(id -g)" /mnt/y5

          # Swap headroom for the serial fat-LTO link, which OOMs on the aarch64 runners
          # without it — see the fuller note on the same step in docs.yml.
          swap_mb="$(awk '/^SwapTotal:/{print int($2/1024)}' /proc/meminfo)"
          if [ "${swap_mb:-0}" -lt 8192 ]; then
            sudo fallocate -l 16G /mnt/y5-swap \
              || sudo dd if=/dev/zero of=/mnt/y5-swap bs=1M count=16384 status=none
            sudo chmod 600 /mnt/y5-swap
            sudo mkswap /mnt/y5-swap >/dev/null
            sudo swapon /mnt/y5-swap
            echo ">> added 16G swap (had ${swap_mb:-0} MiB)"
          else
            echo ">> ${swap_mb} MiB swap already present — leaving it alone"
          fi

          df -h / /mnt; free -h; swapon --show

      # Warm the per-distro cargo target cache (the huge vendored graph). Keyed per distro+arch
      # — incompatible ABIs must never share a cache.
      - uses: actions/cache@v4
        with:
          path: /mnt/y5/cache/${{ matrix.distro }}
          key: multiarch-target-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: multiarch-target-${{ matrix.distro }}-${{ matrix.arch }}-

      - name: Build full install bundle for ${{ matrix.distro }} (${{ matrix.arch }})
        env:
          # VERSION stamps the rc number into the compositor at compile time. The build
          # MODE is image.sh's second argument (`bundle`), not an extra build-arg — the
          # Containerfile REQUIRES it and fails if it is missing, so this path cannot
          # silently fall back to the nested winit dev binary.
          Y5_EXTRA_BUILD_ARGS: >-
            --build-arg VERSION=${{ needs.version.outputs.version }}
        run: |
          # image.sh materializes the source clone, mounts the target cache, and builds the
          # image (tag: y5-distro-<distro>-bundle) with our extra build args.
          environment.container/distributions/image.sh "${{ matrix.distro }}" bundle

      - name: Extract + package the bundle
        id: pkg
        run: |
          combo="${{ matrix.distro }}-${{ matrix.arch }}"
          img="y5-distro-${{ matrix.distro }}-bundle"
          cid="$(podman create "$img")"
          trap 'podman rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          # prepare.sh wrote /out/package.tar.gz (+ its SHA256SUMS) inside the image.
          podman cp "$cid:/out/package.tar.gz" "dist/package-${combo}.tar.gz"
          ( cd dist && sha256sum "package-${combo}.tar.gz" > "package-${combo}.tar.gz.sha256" )
          echo ">> bundle for $combo:"; ls -l "dist/package-${combo}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            dist/package-${{ matrix.distro }}-${{ matrix.arch }}.tar.gz
            dist/package-${{ matrix.distro }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  # Publish every combo's bundle as TWO prereleases on each candidate push — in a `bundles-*`
  # namespace so it never collides with release-rc.yml's v<rc>:
  #   bundles-v<X.Y.Z-rc.N>  versioned (assets refreshed via --clobber on same-commit re-run) —
  #                          a pinnable RC you can point testers at.
  #   bundles-rolling        rolling, recreated each push — the stable "newest" URL + bootstrap.
  # Both hold the SAME set of per-distro tarballs + SHA256SUMS + bootstrap.sh.
  #
  # ⚠ IMMUTABLE RELEASES MUST STAY OFF for this repo. This channel deletes+recreates the rolling
  # tag every run and `--clobber`s the versioned one — both are IMPOSSIBLE under GitHub's immutable
  # releases, which also permanently BURN a tag name once used (a deleted immutable tag can never
  # be reused → HTTP 422 "tag_name was used by an immutable release"). If a tag ever gets burned,
  # pick a NEW name here (that's why these are `bundles-*`, not the burned `multiarch-*`).
  #
  # Like docs.yml's `release`, this publishes whatever the matrix managed to build rather than
  # requiring 9-of-9 — a single flaky runner should not cost the whole candidate channel.
  # `SHA256SUMS` is derived from the bytes actually attached, and `bootstrap.sh` refuses to
  # install a bundle with no line in it, so a missing distro fails closed at download time.
  release:
    needs: [build, version]
    if: ${{ !cancelled() && github.ref == 'refs/heads/candidate' && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4      # for compositor.installer/bootstrap.sh (the install file)
        with:
          fetch-depth: 0       # full history + tags: the changelog compares against the previous release
          fetch-tags: true
      - uses: actions/download-artifact@v4
        continue-on-error: true   # v4 errors on a pattern that matches nothing
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true      # flatten every combo's files into one dir
      - name: Consolidate assets + checksums
        run: |
          shopt -s nullglob
          mkdir -p release
          built=(artifacts/*.tar.gz)
          # Unlike docs.yml there is no Fedora baseline bundle here, so an empty matrix really
          # does leave nothing to publish.
          if [ "${#built[@]}" -eq 0 ]; then
            echo "::error::no matrix leg produced a bundle — nothing to publish"; exit 1
          fi
          cp "${built[@]}" release/
          # Re-derived from the bytes being attached rather than concatenated from the
          # per-combo `.sha256` files, so SHA256SUMS can only ever describe what this release
          # actually carries.
          ( cd release && sha256sum package-*.tar.gz > SHA256SUMS )
          echo ">> ${#built[@]} bundles"; ls -l release
      - name: Publish bundles-v<rc> (versioned) + bundles-rolling (rolling)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          # Say so up front when the matrix came up short, rather than letting a tester find
          # out as a download failure.
          incomplete=""
          if [ "$BUILD_RESULT" != "success" ]; then
            incomplete="> ⚠ **Incomplete bundle set** — some per-distro builds did not finish in
          this run. Only the attached combos are installable; re-run the workflow to top it up.

          "
          fi

          notes="${incomplete}Per-distro × per-arch **install bundles** (v$VERSION, \`candidate\` @ \`${GITHUB_SHA:0:7}\`),
          each built natively in that distro's image with the full component set (compositor, devtool,
          polkit, MX daemon, xwayland, settings, installer) — the same \`prepare.sh\` the Fedora channel uses.

          One \`bootstrap.sh\` (the single cross-platform install file) is attached too: it detects your
          distro + arch, downloads the matching bundle from THIS release, verifies it against
          \`SHA256SUMS\` (mandatory), and runs the installer — on NixOS it prints the nix-ld module/flake.
          \`\`\`
          curl -fsSL <this release>/bootstrap.sh | bash
          # or manually: tar -xzf package-<distro>-<arch>.tar.gz && y5-install/install.sh
          \`\`\`
          The bundles are dynamically linked to each distro's system libraries — not portable across distros."

          # Stamp the published bootstrap so it targets THIS repo. The rolling copy tracks
          # bundles-rolling (always-newest); the pinned copy defaults to this exact rc tag so a
          # versioned download pulls its MATCHING bundles. Both still honor Y5_RELEASE_* overrides.
          mkdir -p pinned
          sed "s|\${Y5_RELEASE_REPO:-y5-snowies/nourish}|\${Y5_RELEASE_REPO:-$GITHUB_REPOSITORY}|" \
            compositor.installer/bootstrap.sh > release/bootstrap.sh
          sed -e "s|\${Y5_RELEASE_REPO:-y5-snowies/nourish}|\${Y5_RELEASE_REPO:-$GITHUB_REPOSITORY}|" \
              -e "s|\${Y5_RELEASE_TAG:-bundles-rolling}|\${Y5_RELEASE_TAG:-bundles-v$VERSION}|" \
            compositor.installer/bootstrap.sh > pinned/bootstrap.sh

          # What shipped since the previous release, appended to BOTH releases below — the
          # versioned one and the rolling pointer, which should agree about what it points at.
          # `--current v$VERSION` excludes release-rc.yml's tag for this same version.
          changelog="$(ci/scripts/release-changelog.sh --rc --current "v$VERSION" || true)"
          notes="$notes"$'\n\n'"$changelog"

          # 1) Versioned rc release. The bundles-v<rc> tag pins THIS commit; created once, then a
          #    re-run of the same commit just refreshes the assets (--clobber — needs immutable
          #    releases OFF). Its own `bundles-*` namespace so it never touches release-rc.yml's.
          if gh release view "bundles-v$VERSION" >/dev/null 2>&1; then
            echo ">> bundles-v$VERSION exists — refreshing assets"
            gh release upload "bundles-v$VERSION" release/*.tar.gz release/SHA256SUMS pinned/bootstrap.sh --clobber
          else
            gh release create "bundles-v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "Multiarch install bundles v$VERSION" \
              --prerelease \
              --latest=false \
              --notes "Nourish multiarch bundles **v$VERSION** (release candidate).

          $notes" \
              release/*.tar.gz release/SHA256SUMS pinned/bootstrap.sh
          fi

          # 2) Rolling "bundles-rolling" — recreated so its tag tracks the current commit; the
          #    stable URL to grab the newest per-distro bundles (+ the always-newest bootstrap) from.
          gh release delete bundles-rolling --yes --cleanup-tag 2>/dev/null || true
          gh release create bundles-rolling \
            --target "$GITHUB_SHA" \
            --title "Multiarch install bundles (latest — v$VERSION)" \
            --prerelease \
            --latest=false \
            --notes "Rolling pointer to the newest multiarch release candidate (currently **v$VERSION**,
          \`candidate\` @ \`${GITHUB_SHA:0:7}\`).

          $notes" \
            release/*.tar.gz release/SHA256SUMS release/bootstrap.sh
