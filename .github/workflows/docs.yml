name: Publish

# Publish everything on merge to `upstream` — the single deployment source of truth. The
# install bundle is built ONCE (the `bundle` job) and fed to both channels so they can never
# drift:
#   Pages (nourish.snowies.com):
#     /                         the marketing site (compositor.website, carries the CNAME)
#     /docs                     coverage report + reference guides
#     /install                  bootstrap.sh — the cross-platform one-liner (~8 KB)
#     /release/latest/fedora44  the Fedora bundle (package.tar.gz + SHA256SUMS) get.sh fetches
#   GitHub Release `v<version>`:
#     package.tar.gz            the same Fedora bundle
#     package-<distro>-<arch>.tar.gz   every other combo, from the `bundles` matrix
#     SHA256SUMS                covers ALL of the above (bootstrap.sh verifies against it)
#     bootstrap.sh              a pinned copy of the installer
#
# The multi-arch bundles are release-only. At ~83 MiB each they do not fit in a Pages site
# (1 GB cap, and `deploy` writes two slots per bundle), and Pages cannot redirect to them —
# static hosting emits no 3xx.
#
# `upstream-integration` is the candidate branch (CI builds + validates via ci.yml); merging
# it into `upstream` is the single release action — one build feeds both Pages and the Release.
on:
  push:
    branches: [upstream]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # the site job reads the coverage artifact from the upstream-integration CI run

# NO workflow-level concurrency. It used to be `group: pages, cancel-in-progress: true`,
# which cancels the ENTIRE run — and now that a run carries a 13-leg bundle matrix, a second
# upstream push would kill hours of native builds to publish a site. The Pages serialization
# it existed for is what actually needs a lock, so the group moved onto the `deploy` job
# alone: pushes still can't race a Pages deployment, but a superseded run finishes its
# bundles and publishes them to the release.
#
# Two runs can therefore both reach `release`. It create-or-clobbers `v<version>` rather
# than assuming the tag is new, so the common case is safe; a genuine simultaneous race can
# still have both take the create path and one fail with HTTP 422, which a re-run fixes.

env:
  # Mirror ci.yml: keep sccache + cargo dirs in the workspace so actions/cache persists them
  # across runs, and drop debug symbols from the doc/coverage builds. Without these the site
  # job recompiled the whole tree cold, with full debug info — which is why it was slow and
  # ran out of disk. (Coverage is unaffected: cargo-llvm-cov reads the coverage map, not DWARF.)
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Compute the release version ONCE (committed VERSION base + git-tag history, see
  # ci/scripts/version.sh) and hand it to every downstream job, so the embedded binary,
  # the /release/<version>/ path and the v<version> GitHub Release can never disagree.
  version:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/y5-ci:fedora44
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history + tags so the patch derivation sees the series
          fetch-tags: true
      - id: compute
        run: |
          v="$(ci/scripts/version.sh)"
          echo ">> release version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The public site: marketing root + coverage report under /docs.
  site:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/y5-ci:fedora44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.SCCACHE_DIR }}
            ${{ env.CARGO_HOME }}/registry
          key: ${{ runner.os }}-site-${{ github.sha }}
          restore-keys: ${{ runner.os }}-site-
      # Reuse coverage from upstream-integration's CI instead of recompiling it here — that
      # instrumented build already ran on the candidate; publishing just needs the report.
      - name: Reuse coverage from the latest upstream-integration CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci-coverage
          run_id="$(gh run list --workflow=ci.yml --branch upstream-integration \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "${run_id:-}" ]; then
            echo ">> reusing coverage from ci.yml run $run_id (upstream-integration)"
            gh run download "$run_id" --name coverage-report --dir .ci-coverage \
              || echo ">> coverage-report artifact missing on run $run_id — publishing without coverage"
          else
            echo ">> no successful upstream-integration CI run found — publishing without coverage"
          fi
      # No recompile here; build-docs.sh just folds in the reused .ci-coverage/ report.
      - name: Build docs site
        run: ci/scripts/build-docs.sh
      - name: Assemble site tree (marketing at root, docs under /docs)
        run: |
          mv public _site_docs
          mkdir public
          mv _site_docs public/docs
          cp -r compositor.website/. public/
          rm -f public/SHOT_LIST.md           # internal shot list — don't publish
      - uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public

  # The install bundle (installer + binaries + components), built once here.
  bundle:
    needs: version
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/y5-ci:fedora44
    steps:
      - uses: actions/checkout@v4
      # Stamp the computed release number into the VERSION file BEFORE building, so the
      # compositor bakes it in at compile time (include_str! in the loader bin). This
      # working-tree edit is never committed — git state stays clean.
      - name: Set build version
        run: |
          echo "${{ needs.version.outputs.version }}" > VERSION
          echo ">> building compositor as $(cat VERSION)"
      - uses: actions/cache@v4
        with:
          # Same key prefix as ci.yml's installer-bundle job, so the bundle built while
          # validating upstream-integration warms this publish build too.
          path: |
            ${{ env.SCCACHE_DIR }}
            ${{ env.CARGO_HOME }}/registry
          key: ${{ runner.os }}-installer-bundle-${{ github.sha }}
          restore-keys: ${{ runner.os }}-installer-bundle-
      - name: Build install bundle (installer + binaries + components)
        run: ci/scripts/package-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: install-bundle
          path: |
            dist/package.tar.gz
            dist/SHA256SUMS

  # Every OTHER (distro × arch) bundle, built natively in that distro's own image. The peer of
  # the `bundle` job above, which stays Fedora-44-only because Pages serves its bytes and
  # `get.sh` fetches them from there.
  #
  # These bundles are published to the GitHub RELEASE only, never to Pages: at ~83 MiB each,
  # 13 of them is ~1.06 GB against Pages' 1 GB site cap — and `deploy` writes two slots per
  # bundle (/release/<version>/ and /release/latest/), so it would be ~2.1 GB. Pages cannot
  # redirect either (static hosting emits no 3xx, and a jekyll-redirect-from meta-refresh page
  # is HTML that `curl -fsSL | tar -xz` would choke on), so the bytes live in exactly one
  # place and `bootstrap.sh` reads them from `releases/latest/download`.
  #
  # WHY per-distro: each bundle is dynamically linked to that distro's glibc / mesa / Vulkan /
  # ffmpeg / webkit. WHY native arm: the aarch64 legs run on `ubuntu-24.04-arm`, so no QEMU.
  # fail-fast:false so one distro missing a dep surfaces itself instead of cancelling the rest.
  bundles:
    name: bundle ${{ matrix.distro }} · ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in step with `multiarch-publish.yml` and with bootstrap.sh's KNOWN.
        # Arch is x86_64-only — the official archlinux image has no arm64 build.
        #
        # NO ubuntu-24.04 / debian-12. smithay enables the `input` crate's `libinput_1_26`
        # feature (vendor/smithay/Cargo.toml) because the tablet-pad dial handling in
        # kernel.native/native.wire/wire.input/input.base/input.rs calls `dial_v120()` /
        # `Dial` / `number()`. Those bind libinput symbols that first exist in libinput 1.26:
        #   libinput_tablet_pad_mode_group_has_dial
        #   libinput_event_tablet_pad_get_dial_delta_v120
        #   libinput_event_tablet_pad_get_dial_number
        # Ubuntu 24.04 ships libinput 1.25.0 and Debian 12 ships 1.22.x, so `y5_compositor`
        # fails to LINK there ("undefined reference to libinput_tablet_pad_mode_group_has_dial").
        # Every distro below is on libinput >= 1.27. To put either back, the dial support has
        # to become conditional (probe `pkg-config --modversion libinput`, select the cargo
        # feature from it, and `#[cfg]` the `TabletPadEvent::Dial` arm) — dropping the feature
        # outright would remove a shipped input feature from ALL distros.
        include:
          - { distro: fedora-43,    arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: fedora-43,    arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: fedora-44,    arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: fedora-44,    arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: debian-13,    arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: debian-13,    arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: ubuntu-26.04, arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: ubuntu-26.04, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: arch,         arch: x86_64,  runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
        # A normal (non-worktree) checkout so distributions/prepare_source can `git clone .` it.

      # Podman + an OCI runtime that can actually start a container. The runner image is NOT a
      # coherent set: images from 2026-07-26 (ubuntu24/20260726.254, ubuntu24-arm64/20260726.74)
      # bumped Podman 4.9.3 -> 5.8.4 while leaving Ubuntu's crun at 1.14.1, which rejects the
      # OCI spec version podman 5 emits:
      #   error running container: from /usr/bin/crun creating container for [...]:
      #   unknown version specified
      # That kills the FIRST `RUN` of every Containerfile, so the leg dies in seconds with no
      # build output. It is not cache-mount specific and a re-run does not help — it depends
      # purely on which runner image the leg lands on, which is why the failing set moved
      # around between attempts while the images rolled out.
      #
      # runc comes with the runner's Docker install and handles podman 5's spec, so pin it
      # whenever it is present. That also keeps every matrix leg on ONE runtime regardless of
      # the image version it happens to get, instead of flapping as new images roll out.
      - name: Ensure podman + a working OCI runtime
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          if command -v runc >/dev/null; then
            mkdir -p ~/.config/containers
            printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
            echo ">> pinned podman to runc (crun on this image may be too old for podman 5)"
          else
            echo ">> runc not found — leaving podman on its default runtime"
          fi
          podman info --format '>> podman {{.Version.Version}} / runtime {{.Host.OCIRuntime.Name}}' || true

      - name: Reclaim disk + swap headroom + stage heavy build dirs on /mnt
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet \
                      /usr/local/.ghcup /opt/ghc || true
          sudo mkdir -p /mnt/y5
          sudo chown -R "$(id -u):$(id -g)" /mnt/y5

          # SWAP. `kernel.loader/Cargo.toml` builds the compositor with `lto = "fat"` +
          # `codegen-units = 1`, so the whole ~1400-unit graph is optimized and linked in ONE
          # serial rustc process. That link is the peak-memory moment of the entire build, and
          # on the aarch64 runners it exceeds RAM: the OOM killer takes rustc out with
          #   ... -C lto=fat -C codegen-units=1 ... (signal: 9, SIGKILL: kill)
          # which is what killed both Fedora arm legs in runs 30513595779 and 30529911514
          # (in the first of those it took the runner agent with it — the job recorded no steps
          # at all). Hosted runners ship little or no swap, so give the link somewhere to page.
          # Slower than RAM, but these legs already run 40+ minutes and the alternative is a
          # dead leg. Deliberately NOT solved by dropping to thin LTO — the fat-LTO binary is
          # what ships.
          swap_mb="$(awk '/^SwapTotal:/{print int($2/1024)}' /proc/meminfo)"
          if [ "${swap_mb:-0}" -lt 8192 ]; then
            # Outside /mnt/y5 — that path is the cached cargo target dir.
            sudo fallocate -l 16G /mnt/y5-swap \
              || sudo dd if=/dev/zero of=/mnt/y5-swap bs=1M count=16384 status=none
            sudo chmod 600 /mnt/y5-swap
            sudo mkswap /mnt/y5-swap >/dev/null
            sudo swapon /mnt/y5-swap
            echo ">> added 16G swap (had ${swap_mb:-0} MiB)"
          else
            echo ">> ${swap_mb} MiB swap already present — leaving it alone"
          fi

          df -h / /mnt; free -h; swapon --show

      # Per-distro+arch cargo target cache. Keyed per combo — incompatible ABIs must never
      # share one.
      - uses: actions/cache@v4
        with:
          path: /mnt/y5/cache/${{ matrix.distro }}
          key: release-target-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: release-target-${{ matrix.distro }}-${{ matrix.arch }}-

      - name: Build full install bundle for ${{ matrix.distro }} (${{ matrix.arch }})
        env:
          # VERSION stamps the STABLE release number in — the same value the Fedora
          # `bundle` job writes to VERSION, so every artifact of this run agrees. The
          # build MODE is image.sh's second argument (`bundle`), not an extra build-arg —
          # the Containerfile REQUIRES it and fails if it is missing, so this path cannot
          # silently fall back to the nested winit dev binary.
          Y5_EXTRA_BUILD_ARGS: >-
            --build-arg VERSION=${{ needs.version.outputs.version }}
        run: environment.container/distributions/image.sh "${{ matrix.distro }}" bundle

      - name: Extract + package the bundle
        run: |
          combo="${{ matrix.distro }}-${{ matrix.arch }}"
          img="y5-distro-${{ matrix.distro }}-bundle"
          cid="$(podman create "$img")"
          trap 'podman rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          # prepare.sh wrote /out/package.tar.gz inside the image.
          podman cp "$cid:/out/package.tar.gz" "dist/package-${combo}.tar.gz"
          ( cd dist && sha256sum "package-${combo}.tar.gz" > "package-${combo}.tar.gz.sha256" )
          ls -l "dist/package-${combo}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            dist/package-${{ matrix.distro }}-${{ matrix.arch }}.tar.gz
            dist/package-${{ matrix.distro }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  # Lay the bundle into the site tree under /release/... and deploy the single Pages artifact.
  # Deliberately does NOT depend on `bundles`: the site must publish in minutes, not wait on a
  # 13-leg native matrix. That is the whole point of keeping the multi-arch bytes on the
  # release instead of in the Pages artifact.
  deploy:
    needs: [site, bundle, version]
    runs-on: ubuntu-latest
    # The Pages lock lives here rather than on the workflow, so a superseded run loses only
    # its deployment, not its in-flight bundle builds.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4      # for compositor.installer/bootstrap.sh
      - uses: actions/download-artifact@v4
        with:
          name: site-public
          path: public
      - uses: actions/download-artifact@v4
        with:
          name: install-bundle
          path: bundle
      - name: Place the install bundle at /release/<version>/ and /release/latest/
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Immutable per-version path plus the rolling "latest" the installer fetches —
          # identical bytes, so a pinned download and the latest download never drift.
          for slot in "$VERSION" latest; do
            mkdir -p "public/release/$slot/fedora44"
            cp bundle/package.tar.gz bundle/SHA256SUMS "public/release/$slot/fedora44/"
          done
      # `/install` — the cross-platform one-liner the README and the guide point at
      # (`curl -fsSL https://nourish.snowies.com/install | bash`), and what
      # `y5.compositor.update` re-fetches. Served from Pages because it is ~8 KB; the bundles
      # it downloads are release assets. Stamped so it targets THIS repo, and left on its
      # default channel — empty tag, i.e. `releases/latest/download`, the newest STABLE
      # release. It must never default to `bundles-rolling`: that tag is candidate output.
      - name: Publish bootstrap.sh at /install
        run: |
          sed "s|\${Y5_RELEASE_REPO:-y5-snowies/nourish}|\${Y5_RELEASE_REPO:-$GITHUB_REPOSITORY}|" \
            compositor.installer/bootstrap.sh > public/install
          chmod 0644 public/install
          head -1 public/install
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

  # Publish the bundle as a single versioned GitHub Release on every upstream push, so the
  # Release assets and the Pages /release/ downloads are always the identical artifact:
  #   v<version>  auto-numbered (patch bumped from tag history) — marked "Latest" so the README
  #               badge, GitHub's "Latest release" pointer (releases/latest/download/…) and the
  #               exact-version pin (releases/download/v<version>/…) all track the real number.
  # NOTE: no rolling `latest` *release* — nothing consumes releases/download/latest/… (the
  # installer fetches Pages /release/latest/fedora44/, bootstrap.sh defaults to bundles-rolling).
  # A rolling `latest` release-tag was also permanently burned by GitHub's immutable-releases
  # window (2026-07-03..06) and can never be recreated; the semantic Latest pointer covers it.
  # ONE release, published once. `release` waits for the whole bundle matrix and attaches
  # everything in a single call: the Fedora `package.tar.gz`, all thirteen
  # `package-<distro>-<arch>.tar.gz`, one combined `SHA256SUMS`, and `bootstrap.sh`.
  #
  # PARTIAL PUBLISH IS ALLOWED. `release` runs on whatever the matrix managed to build — it
  # is gated on `bundle` (the Fedora bundle Pages also serves) and `version`, NOT on every
  # `bundles` leg succeeding. Blocking the whole release on 13-of-13 meant one flaky runner
  # published nothing at all: run 30513595779 lost 7 legs — 4 to a real libinput mismatch and
  # 3 to a podman/crun regression in a mid-run runner-image rollout — and shipped no release
  # despite 6 good bundles and a good Fedora bundle.
  #
  # A short release is safe because `SHA256SUMS` is generated from the bytes actually being
  # attached, never from a fixed list. `bootstrap.sh` downloads exactly one
  # `package-<distro>-<arch>.tar.gz` and refuses to install anything it has no SHA256SUMS line
  # for, so a distro missing from this release is a clean "does this distro/arch combo exist
  # in the release?" failure at download time — never an unverified or mismatched install.
  # That is the property the old all-or-nothing rule was protecting, and it holds per-asset.
  #
  # Topping up works: artifacts persist across attempts, so re-running the failed legs and
  # then `release` re-downloads the FULL set, regenerates `SHA256SUMS` over it, and
  # `--clobber`s the same `v<version>` tag.
  #
  # Release latency is NOT the site's latency: `deploy` needs only [site, bundle, version],
  # so the website and the Fedora Pages download still land in minutes.
  release:
    needs: [bundle, bundles, version]
    # `!cancelled()` rather than `always()` — a cancelled run should not publish. `bundles` is
    # intentionally absent from the guard: any subset of it (including none) is publishable.
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4      # for compositor.installer/bootstrap.sh
      - uses: actions/download-artifact@v4
        with:
          name: install-bundle
          path: fedora
      # `pattern:` matters — this workflow also produces `site-public` and `install-bundle`,
      # and a pattern-less download would flatten those in beside the bundles.
      # `continue-on-error` because v4 errors when a pattern matches nothing: if every matrix
      # leg failed we still publish the Fedora-only release rather than losing the run.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true
      - name: Assemble assets + one combined SHA256SUMS
        run: |
          shopt -s nullglob
          mkdir -p release
          cp fedora/package.tar.gz release/

          # Whatever the matrix produced. `artifacts/` may be empty or absent entirely.
          extra=(artifacts/*.tar.gz)
          if [ "${#extra[@]}" -gt 0 ]; then cp "${extra[@]}" release/; fi

          # Written once, over exactly the assets being attached — never a fixed list, so it
          # can never promise a bundle this release does not carry. `bootstrap.sh` fetches
          # this one file and greps it for `package-<distro>-<arch>.tar.gz`, so it must list
          # the per-distro bundles as well as the Fedora one. Checksums are re-derived from
          # the bytes being attached rather than copied from the per-combo `.sha256` files,
          # so they cannot disagree with what ships.
          ( cd release && sha256sum package.tar.gz package-*.tar.gz > SHA256SUMS )
          echo ">> ${#extra[@]} per-distro bundles + the Fedora bundle"; cat release/SHA256SUMS
      - name: Publish v<version>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          BUNDLES_RESULT: ${{ needs.bundles.result }}
        run: |
          # `release/package-*.tar.gz` legitimately matches nothing on a short matrix, so every
          # glob in this step runs under nullglob and goes through an array — an unexpanded
          # literal would end up in the release notes and, worse, as a filename argument to gh.
          shopt -s nullglob
          bundles=(release/package-*.tar.gz)

          # Stamp the published bootstrap so it targets THIS repo. Left on its default
          # channel — empty tag, i.e. `releases/latest/download` — so it tracks the newest
          # STABLE release rather than `bundles-rolling`, which is candidate output.
          sed "s|\${Y5_RELEASE_REPO:-y5-snowies/nourish}|\${Y5_RELEASE_REPO:-$GITHUB_REPOSITORY}|" \
            compositor.installer/bootstrap.sh > release/bootstrap.sh

          # The combos this release actually carries, straight off disk — so the notes can
          # never claim a bundle that is not attached. When the matrix came up short, say so
          # up front rather than letting a user discover it as a download failure.
          shipped=""
          for b in "${bundles[@]}"; do
            b="${b##*/package-}"
            shipped="$shipped  - \`${b%.tar.gz}\`"$'\n'
          done
          [ -n "$shipped" ] || shipped="  - _none — this release carries only the Fedora \`package.tar.gz\`_"
          incomplete=""
          if [ "$BUNDLES_RESULT" != "success" ]; then
            incomplete="> ⚠ **Incomplete bundle set.** Some per-distro builds did not finish in
          this run, so the distros listed below are all this release carries. The one-liner
          fails cleanly (it verifies against \`SHA256SUMS\` before installing) on anything
          absent — re-run the workflow to top this release up.
          "
          fi

          notes="$incomplete
          \`package.tar.gz\` is the Fedora install bundle — prebuilt compositor +
          components + the \`y5-install\` installer — the same artifact served under
          https://nourish.snowies.com/release/. Extract it and run \`y5-install/install.sh\`.

          \`package-<distro>-<arch>.tar.gz\` is the same bundle built natively for each
          supported distribution and CPU architecture. Each is dynamically linked to that
          distro's own glibc / mesa / Vulkan / ffmpeg / webkit, so they are not portable
          across distros. \`SHA256SUMS\` covers every asset here — and only the assets here.

          Bundles in this release:
          $shipped

          The easiest way in is the one-liner, which picks the right one for you:
          \`\`\`
          curl -fsSL https://nourish.snowies.com/install | bash
          \`\`\`"

          assets=(release/package.tar.gz "${bundles[@]}" release/SHA256SUMS release/bootstrap.sh)

          # The `v<version>` tag pins this commit; created once, then a re-run of the same
          # commit just refreshes the assets — which is also how a short release gets topped
          # up once the missing legs are re-run.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo ">> release v$VERSION exists — refreshing assets"
            gh release upload "v$VERSION" "${assets[@]}" --clobber
          else
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --latest \
              --notes "Nourish v$VERSION — built from \`upstream\` @ ${GITHUB_SHA:0:7}.

          $notes" \
              "${assets[@]}"
          fi
