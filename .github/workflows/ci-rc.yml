name: CI RC

# Release-candidate sibling of ci.yml. Same jobs, same image, same scripts, so the rc channel
# is validated exactly the way the stable channel is.
#
#   candidate-integration  --(you merge by hand)-->  candidate  ->  this workflow + release-rc.yml
#
# Runs on `candidate` ONLY. `candidate-integration` is a plain staging trunk with no workflow
# and no artifacts: stack commits there and merge into `candidate` yourself when you choose to
# cut an rc. That manual merge is the deliberate build-and-publish gate — see ci/README.md.
#
# `candidate` therefore runs this alongside release-rc.yml, mirroring `upstream`, which runs
# ci.yml alongside docs.yml. The two share the `rc-installer-bundle-` cache key, so whichever
# starts first warms the other rather than building the bundle twice cold.
on:
  push:
    branches: [candidate]
  pull_request:
    branches: [candidate]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/y5-ci:fedora44
  # Keep the sccache + cargo dirs inside the workspace so actions/cache can persist them.
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  # Same rationale as ci.yml: CI doesn't need debug symbols, and dropping them is what keeps
  # the big workspaces (bevy/wgpu/ffmpeg) under the runner's ~14 GB.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Validate the y5_compositor udev_release build path once (the loader entry) — identical to
  # ci.yml's build-udev. This is the single root build: the actual product.
  build-udev:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/y5-ci:fedora44
    steps:
      - uses: actions/checkout@v4
      - run: environment/build-optimized.sh udev

  # Build the install bundle the same way release-rc.yml does — same cache key, so this is
  # not a second cold build. Push-only: a PR does not need the artifact.
  installer-bundle:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/y5-ci:fedora44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.SCCACHE_DIR }}
            ${{ env.CARGO_HOME }}/registry
          key: ${{ runner.os }}-rc-installer-bundle-${{ github.sha }}
          restore-keys: ${{ runner.os }}-rc-installer-bundle-
      - name: Build install bundle (installer + binaries + components)
        run: ci/scripts/package-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: install-bundle-${{ github.ref_name }}
          path: |
            dist/package.tar.gz
            dist/SHA256SUMS
